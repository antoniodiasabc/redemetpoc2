services:
  mongo:
    image: mongo:7
    command: mongod --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - shared-data:/data:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - JAVA_OPTS=${JAVA_OPTS}
      - REDEMET_USERNAME=${REDEMET_USERNAME}
      - REDEMET_PASSWORD=${REDEMET_PASSWORD}
      - OPMET_USERNAME=${OPMET_USERNAME}
      - OPMET_PASSWORD=${OPMET_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CESIUM_TOKEN=${CESIUM_TOKEN}
      - SIGWX_PATH=/sigwx
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CLEANUP_RETENTION_DAYS=${CLEANUP_RETENTION_DAYS}
    volumes:
      - shared-data:/app/data
      - ./data/config:/app/data/config
      - /home/aodias/sigwx:/sigwx:ro
    depends_on:
      - redis
      - mongo
    restart: unless-stopped
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./logging/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.0
    volumes:
      - ./logging/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./logging/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./logging/level.lua:/fluent-bit/etc/level.lua:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./logging/grafana-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
    depends_on:
      - loki
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  shared-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
  loki_data:
  grafana_data:
  mongo_data:
