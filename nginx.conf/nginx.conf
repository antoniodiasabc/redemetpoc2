worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Buffers para 2000 usuários
    client_body_buffer_size 16k;
    client_max_body_size 50m;
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Upstream com DNS dinâmico do Docker (escala automática via --scale)
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream pocsigmet {
        least_conn;
        server app:8082 max_fails=5 fail_timeout=30s;
        keepalive 128;
    }

    # Cache para imagens
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=img_cache:10m max_size=1g inactive=60m;

    server {
        listen 80;
        server_name _;

        # Headers de segurança HTTP
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Conexões simultâneas por IP
        limit_conn conn 100;

        # Arquivos estáticos de /data (imagens satélite + GRIB2)
        location /data/ {
            alias /data/;
            expires 30s;
            add_header Cache-Control "public, max-age=30";
            add_header Access-Control-Allow-Origin "*";
            try_files $uri $uri/ =204;
        }

        # Health check (sem rate limit)
        location = /health {
            proxy_pass http://pocsigmet;
            proxy_set_header Host $host;
        }

        # SSE — sem buffering, timeout longo
        location = /api/v1/opmet/stream {
            proxy_pass http://pocsigmet;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # APIs com rate limiting
        location / {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://pocsigmet;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;

            # CORS
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }
}
