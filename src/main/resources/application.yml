server:
  port: 8082
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: pocsigmet-spring-final

  data:
    mongodb:
      uri: mongodb://mongo:27017/metardb
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:oracle:thin:@${DB_HOST:10.103.3.43}:${DB_PORT:1521}:${DB_NAME:OPMETDB}
    username: ${DB_USERNAME:novoopmet}
    password: ${DB_PASSWORD:mudar123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariCP-OPMET
      
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.Oracle12cDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0
        
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Sao_Paulo

# Configurações customizadas
app:
  redemet:
    base-url: https://opmet.decea.mil.br/redemet/consulta_redemet
    username: ${REDEMET_USERNAME:testeicaolima}
    password: ${REDEMET_PASSWORD:Mudar12345@}
  opmet:
    username: ${OPMET_USERNAME:iwxxm2}
    password: ${OPMET_PASSWORD:Mudar123@}
    timeout: 30s
    
  cache:
    airports-duration: 24h
    metar-duration: 45s
    
  processing:
    thread-pool-size: 30
    image-processing-enabled: true
    hsv-analysis-enabled: true
    
  grib2:
    data-path: ${GRIB2_DATA_PATH:./data/grib2}
    download-enabled: true

  sigwx:
    path: ${SIGWX_PATH:/mnt/c/Users/aodias/sigwx}
    
logging:
  level:
    com.pocsigmet: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/pocsigmet.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: false
    defaults:
      enabled: true
