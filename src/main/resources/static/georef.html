<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Georef Tool</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>
<style>
  body { margin: 0; background: #1a1a1a; color: white; font-family: monospace; }
  #map { width: 100vw; height: 100vh; cursor: default; }
  #panel {
    position: fixed; top: 10px; right: 10px; z-index: 999;
    background: rgba(20,20,40,0.95); padding: 12px; border-radius: 8px;
    width: 260px; font-size: 12px;
  }
  #panel input[type=file] { width: 100%; margin-bottom: 8px; }
  #panel label { display: block; margin: 4px 0 2px; }
  #panel input[type=number] { width: 100%; box-sizing: border-box; background: #333; color: white; border: 1px solid #555; padding: 3px; }
  #panel button { width: 100%; margin-top: 6px; padding: 6px; cursor: pointer; background: #0055aa; color: white; border: none; border-radius: 4px; }
  #extent-out { margin-top: 8px; background: #111; padding: 6px; border-radius: 4px; word-break: break-all; cursor: pointer; }
  #opacity-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #mode-row { display: flex; gap: 4px; margin-top: 6px; }
  #mode-row button { flex: 1; padding: 5px; font-size: 11px; }
  .active-mode { background: #aa5500 !important; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>🛰️ Georef Tool</b><br><br>
  <input type="file" id="imgFile" accept="image/*">
  <label>West</label><input type="number" id="west" value="-99.75" step="0.1">
  <label>East</label><input type="number" id="east" value="-25.25" step="0.1">
  <label>South</label><input type="number" id="south" value="-55" step="0.1">
  <label>North</label><input type="number" id="north" value="20" step="0.1">
  <div id="opacity-row">
    <label style="margin:0">Opacidade</label>
    <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.7" style="flex:1">
  </div>
  <div id="mode-row">
    <button id="btn-move" class="active-mode" onclick="setMode('move')">✋ Mover</button>
    <button id="btn-resize" onclick="setMode('resize')">↔ Resize</button>
  </div>
  <button onclick="copyExtent()" style="background:#005500;margin-top:8px">📋 Copiar Extent</button>
  <div id="extent-out" onclick="copyExtent()">—</div>
  <div style="margin-top:6px;color:#aaa;font-size:10px">Mover: arrasta a imagem<br>Resize: arrasta as bordas</div>
</div>

<script>
// FIRs Brasil
const firLayer = new ol.layer.Vector({
  source: new ol.source.Vector({ url: '/firs.geojson', format: new ol.format.GeoJSON() }),
  style: new ol.style.Style({
    stroke: new ol.style.Stroke({ color: '#003399', width: 2 }),
    fill: new ol.style.Fill({ color: 'rgba(0,50,150,0.05)' })
  })
});

// Graticule (grade lat/lon)
const graticule = new ol.layer.Graticule({
  strokeStyle: new ol.style.Stroke({ color: 'rgba(255,255,255,0.4)', width: 1, lineDash: [4, 4] }),
  showLabels: true,
  lonLabelStyle: new ol.style.Text({ font: '11px monospace', fill: new ol.style.Fill({ color: '#fff' }), backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.5)' }), padding: [2,2,2,2] }),
  latLabelStyle: new ol.style.Text({ font: '11px monospace', fill: new ol.style.Fill({ color: '#fff' }), backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.5)' }), padding: [2,2,2,2] }),
});

const map = new ol.Map({
  target: 'map',
  layers: [new ol.layer.Tile({ source: new ol.source.OSM() }), firLayer, graticule],
  view: new ol.View({ center: ol.proj.fromLonLat([-55, -15]), zoom: 3 })
});

let imgLayer = null;
let imgUrl = null;
let mode = 'move'; // 'move' | 'resize'
let dragging = false;
let dragStart = null;
let extentStart = null;
let resizeEdge = null; // 'left','right','top','bottom'

function getFields() {
  return {
    w: parseFloat(document.getElementById('west').value),
    e: parseFloat(document.getElementById('east').value),
    s: parseFloat(document.getElementById('south').value),
    n: parseFloat(document.getElementById('north').value)
  };
}

function setFields(w, s, e, n) {
  document.getElementById('west').value  = w.toFixed(2);
  document.getElementById('east').value  = e.toFixed(2);
  document.getElementById('south').value = s.toFixed(2);
  document.getElementById('north').value = n.toFixed(2);
  updateExtentDisplay();
}

function getExtent4326() {
  const f = getFields();
  return [f.w, f.s, f.e, f.n];
}

function toMerc(ext4326) {
  return ol.proj.transformExtent(ext4326, 'EPSG:4326', 'EPSG:3857');
}

function applyImage() {
  if (!imgUrl) return;
  if (imgLayer) map.removeLayer(imgLayer);
  const opacity = parseFloat(document.getElementById('opacity').value);
  imgLayer = new ol.layer.Image({
    source: new ol.source.ImageStatic({ url: imgUrl, imageExtent: toMerc(getExtent4326()) }),
    opacity: opacity
  });
  map.addLayer(imgLayer);
  updateExtentDisplay();
}

function refreshLayer() {
  if (!imgLayer) return;
  map.removeLayer(imgLayer);
  const opacity = parseFloat(document.getElementById('opacity').value);
  imgLayer = new ol.layer.Image({
    source: new ol.source.ImageStatic({ url: imgUrl, imageExtent: toMerc(getExtent4326()) }),
    opacity: opacity
  });
  map.addLayer(imgLayer);
}

document.getElementById('imgFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  imgUrl = URL.createObjectURL(file);
  applyImage();
});

document.getElementById('opacity').addEventListener('input', () => {
  if (imgLayer) imgLayer.setOpacity(parseFloat(document.getElementById('opacity').value));
});

['west','east','south','north'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { if (imgLayer) refreshLayer(); updateExtentDisplay(); });
});

function setMode(m) {
  mode = m;
  document.getElementById('btn-move').classList.toggle('active-mode', m === 'move');
  document.getElementById('btn-resize').classList.toggle('active-mode', m === 'resize');
  map.getViewport().style.cursor = m === 'move' ? 'grab' : 'crosshair';
}

// pixel -> lon/lat
function pixelToLonLat(pixel) {
  const coord = map.getCoordinateFromPixel(pixel);
  return ol.proj.toLonLat(coord);
}

function getResizeEdge(pixel, ext4326) {
  const [w, s, e, n] = ext4326;
  const ll = pixelToLonLat(pixel);
  const lon = ll[0], lat = ll[1];
  const dw = Math.abs(lon - w), de = Math.abs(lon - e);
  const ds = Math.abs(lat - s), dn = Math.abs(lat - n);
  const threshold = (e - w) * 0.08;
  if (dw < threshold) return 'left';
  if (de < threshold) return 'right';
  if (ds < threshold) return 'bottom';
  if (dn < threshold) return 'top';
  return null;
}

map.getViewport().addEventListener('mousedown', e => {
  if (!imgLayer || e.button !== 0) return;
  const pixel = map.getEventPixel(e);
  const ext = getExtent4326();
  const ll = pixelToLonLat(pixel);

  if (mode === 'move') {
    // verifica se clicou dentro da imagem
    if (ll[0] >= ext[0] && ll[0] <= ext[2] && ll[1] >= ext[1] && ll[1] <= ext[3]) {
      dragging = true;
      dragStart = ll;
      extentStart = [...ext];
      map.getInteractions().forEach(i => i.setActive(false));
      map.getViewport().style.cursor = 'grabbing';
    }
  } else {
    resizeEdge = getResizeEdge(pixel, ext);
    if (resizeEdge) {
      dragging = true;
      dragStart = ll;
      extentStart = [...ext];
      map.getInteractions().forEach(i => i.setActive(false));
    }
  }
});

map.getViewport().addEventListener('mousemove', e => {
  if (!dragging) return;
  const pixel = map.getEventPixel(e);
  const ll = pixelToLonLat(pixel);
  const dx = ll[0] - dragStart[0];
  const dy = ll[1] - dragStart[1];
  const [w, s, e2, n] = extentStart;

  if (mode === 'move') {
    setFields(w + dx, s + dy, e2 + dx, n + dy);
  } else {
    let nw = w, ns = s, ne = e2, nn = n;
    if (resizeEdge === 'left')   nw = w + dx;
    if (resizeEdge === 'right')  ne = e2 + dx;
    if (resizeEdge === 'bottom') ns = s + dy;
    if (resizeEdge === 'top')    nn = n + dy;
    setFields(nw, ns, ne, nn);
  }
  refreshLayer();
});

map.getViewport().addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  map.getInteractions().forEach(i => i.setActive(true));
  map.getViewport().style.cursor = mode === 'move' ? 'grab' : 'crosshair';
});

function updateExtentDisplay() {
  const f = getFields();
  document.getElementById('extent-out').textContent = `[${f.w}, ${f.s}, ${f.e}, ${f.n}]`;
}

function copyExtent() {
  const txt = document.getElementById('extent-out').textContent;
  navigator.clipboard.writeText(txt);
  document.getElementById('extent-out').textContent = '✅ Copiado!';
  setTimeout(updateExtentDisplay, 1500);
}

updateExtentDisplay();
</script>
</body>
</html>
